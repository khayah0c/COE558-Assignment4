
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COE558 Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f4f8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }

    h1 {
        color: #243b53;
        margin-bottom: 30px;
    }

    input, select, button {
        width: 280px;
        padding: 14px;
        margin: 8px;
        font-size: 16px;
        border: 1px solid #bcccdc;
        border-radius: 8px;
        box-sizing: border-box;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #1d4ed8;
    }

    #result {
        color: #243b53;
        margin-top: 24px;
    }
</style>

</head>
<body>
    <h1>Web Calculator</h1>

    <input type="number" id="num1" placeholder="First number" step="any">

    <select id="operation">
        <option value="add">Addition (+)</option>
        <option value="subtract">Subtraction (-)</option>
        <option value="multiply">Multiplication (×)</option>
        <option value="divide">Division (÷)</option>
    </select>

    <input type="number" id="num2" placeholder="Second number" step="any">

    <button onclick="calculate()">Calculate</button>

    <h2 id="result"></h2>

    <script>
        async function calculate() {
            const num1 = document.getElementById("num1").value;
            const num2 = document.getElementById("num2").value;
            const operation = document.getElementById("operation").value;
            const result = document.getElementById("result");

            if (num1 === "" || num2 === "") {
                result.textContent = "Please enter both numbers.";
                return;
            }

            try {
                const response = await fetch("/calculate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        num1: Number(num1),
                        num2: Number(num2),
                        operation: operation
                    })
                });

                const data = await response.json();

                result.textContent = response.ok
                    ? "Result: " + data.result
                    : "Error: " + (data.error || "Calculation failed");
            } catch (error) {
                result.textContent = "Unable to connect to the server.";
            }
        }
    </script>
</body>
</html>
